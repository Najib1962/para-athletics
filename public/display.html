<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display - Para Athletics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-bar .meet-name {
            font-size: 20px;
            font-weight: 700;
            color: #e94560;
        }
        .top-bar .meet-venue {
            font-size: 14px;
            color: #999;
        }
        .top-bar .status {
            font-size: 14px;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Event Selector */
        .event-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .event-selector select {
            flex: 1;
            padding: 12px 20px;
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            min-width: 200px;
        }
        .event-selector button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .event-selector button:hover {
            background: #c73e54;
        }

        /* Main Display */
        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 16px;
            border: 2px solid #2a2a4e;
            padding: 30px;
            min-height: 500px;
        }

        .event-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a2a4e;
            margin-bottom: 20px;
        }
        .event-header h1 {
            font-size: 36px;
            font-weight: 700;
        }
        .event-header .meta {
            font-size: 18px;
            color: #999;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .event-header .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }
        .status-official { background: #4CAF50; color: #fff; }
        .status-pending { background: #FF9800; color: #fff; }
        .status-live { background: #e94560; color: #fff; animation: pulse 2s infinite; }

        /* Results Table */
        .results-table {
            flex: 1;
            width: 100%;
            border-collapse: collapse;
            font-size: 24px;
        }
        .results-table th {
            background: #2a2a4e;
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            color: #ccc;
            font-size: 18px;
        }
        .results-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2a4e;
            font-size: 26px;
        }
        .results-table tr:last-child td {
            border-bottom: none;
        }
        .results-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        .rank-1 { color: #FFD700; font-weight: 700; }
        .rank-2 { color: #C0C0C0; font-weight: 700; }
        .rank-3 { color: #CD7F32; font-weight: 700; }
        .rank-dns { color: #666; font-style: italic; }

        .points-col {
            color: #FFD700;
            font-weight: 700;
            text-align: center;
        }

        .no-results {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 24px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px 20px;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            border-top: 1px solid #2a2a4e;
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            text-align: right;
            font-size: 12px;
            color: #555;
            margin-top: 10px;
        }

        /* Large display optimizations */
        @media (min-width: 1200px) {
            .results-table {
                font-size: 32px;
            }
            .results-table td {
                font-size: 34px;
                padding: 20px 25px;
            }
            .results-table th {
                font-size: 24px;
                padding: 20px 25px;
            }
            .event-header h1 {
                font-size: 48px;
            }
            .event-header .meta {
                font-size: 24px;
            }
        }

        @media (max-width: 768px) {
            .display-container {
                padding: 15px;
            }
            .results-table {
                font-size: 16px;
            }
            .results-table td {
                font-size: 18px;
                padding: 10px 12px;
            }
            .results-table th {
                font-size: 14px;
                padding: 10px 12px;
            }
            .event-header h1 {
                font-size: 24px;
            }
            .event-header .meta {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div>
            <div class="meet-name" id="meetName">🏃 Para Athletics</div>
            <div class="meet-venue" id="meetVenue">Loading...</div>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>LIVE</span>
            <span style="margin-left: 15px; color: #666;" id="updateTime">Updating...</span>
        </div>
    </div>

    <!-- Event Selector -->
    <div class="event-selector">
        <select id="eventSelect" onchange="loadResults()">
            <option value="">-- Select an event --</option>
        </select>
        <button onclick="loadResults()">🔄 Refresh</button>
        <button onclick="toggleAutoRefresh()" id="autoBtn" style="background: #4CAF50;">⏱ Auto: ON</button>
        <button onclick="goFullscreen()" style="background: #2196F3;">⛶ Fullscreen</button>
    </div>

    <!-- Display Container -->
    <div class="display-container" id="displayContainer">
        <div class="no-results">Select an event to display live results</div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span>🏃 Para Athletics Competition Management System</span>
        <span style="margin-left: 20px;" id="autoStatus">Auto-refresh: ON (5s)</span>
    </div>

    <script>
        let autoRefreshInterval = null;
        let currentEventId = null;
        let isAutoRefresh = true;

        async function fetchAPI(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }

        async function loadEvents() {
            try {
                const events = await fetchAPI('/api/events');
                const select = document.getElementById('eventSelect');
                const currentVal = select.value;

                select.innerHTML = '<option value="">-- Select an event --</option>';
                events.forEach(e => {
                    const opt = document.createElement('option');
                    opt.value = e.id;
                    const classes = e.classes ? e.classes.join(', ') : e.class || 'Single';
                    opt.textContent = `${e.name} (${e.discipline}) - ${classes}`;
                    select.appendChild(opt);
                });

                if (currentVal) select.value = currentVal;
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        async function loadMeetInfo() {
            try {
                const meet = await fetchAPI('/api/meet');
                document.getElementById('meetName').textContent = `🏃 ${meet.name || 'Para Athletics'}`;
                document.getElementById('meetVenue').textContent = `${meet.venue || ''} • ${meet.date || ''}`;
            } catch (error) {
                console.error('Error loading meet info:', error);
            }
        }

        async function loadResults() {
            const eventId = document.getElementById('eventSelect').value;
            currentEventId = eventId;

            if (!eventId) {
                document.getElementById('displayContainer').innerHTML = `
                    <div class="no-results">Select an event to display live results</div>
                `;
                return;
            }

            try {
                const data = await fetchAPI(`/api/events/${eventId}/results`);
                displayResults(data);
                document.getElementById('updateTime').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.getElementById('displayContainer').innerHTML = `
                    <div class="no-results">Error loading results: ${error.message}</div>
                `;
            }
        }

        function displayResults(data) {
            const container = document.getElementById('displayContainer');
            const event = data.event;
            const results = data.results || [];
            const isCombined = data.isCombinedClass || false;
            const hasPoints = results.some(r => r.points !== null && r.points > 0);

            const statusClass = event.status === 'official' ? 'status-official' :
                               event.status === 'live' ? 'status-live' : 'status-pending';
            const statusLabel = event.status === 'official' ? '✓ OFFICIAL' :
                               event.status === 'live' ? '🔴 LIVE' : '⏳ Pending';

            const hasResults = results.some(r => r.mark && !['DNS', 'DNF', 'DQ', 'NM'].includes(r.mark));

            let html = `
                <div class="event-header">
                    <h1>${event.name}</h1>
                    <div class="meta">
                        <span>${event.discipline}</span>
                        <span>${event.sex}</span>
                        <span>${event.round || 'Final'}</span>
                        <span>Day ${event.day || 1}</span>
                    </div>
                    <span class="status-badge ${statusClass}">${statusLabel}</span>
                    ${event.summary ? `<p style="color: #999; margin-top: 10px; font-size: 16px;">${event.summary}</p>` : ''}
                </div>
            `;

            if (results.length === 0) {
                html += `<div class="no-results">No athletes entered yet</div>`;
            } else if (!hasResults) {
                html += `<div class="no-results">⏳ Waiting for marks...</div>`;
            } else {
                // Determine columns
                const showGuide = results.some(r => r.hasGuide);
                const showPoints = isCombined || hasPoints;

                html += `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th style="width:60px;">#</th>
                                <th>Name</th>
                                <th style="width:80px;">Class</th>
                                ${showGuide ? '<th style="width:70px;">Guide</th>' : ''}
                                <th style="width:120px; text-align:center;">Mark</th>
                                ${showPoints ? '<th style="width:80px; text-align:center;">Points</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                `;

                results.forEach(r => {
                    const isDNS = ['DNS', 'DNF', 'DQ', 'NM'].includes(r.mark);
                    const rankClass = r.rank === 1 ? 'rank-1' :
                                     r.rank === 2 ? 'rank-2' :
                                     r.rank === 3 ? 'rank-3' :
                                     isDNS ? 'rank-dns' : '';
                    const rankDisplay = r.rank === '-' ? '-' : r.rank;

                    html += `
                        <tr>
                            <td class="${rankClass}">${rankDisplay}</td>
                            <td>${r.name}</td>
                            <td>${r.class}</td>
                            ${showGuide ? `<td>${r.guide || '-'}</td>` : ''}
                            <td style="text-align:center; ${isDNS ? 'color:#666; font-style:italic;' : 'font-weight:600;'}">${r.mark}</td>
                            ${showPoints ? `<td class="points-col">${r.points || '-'}</td>` : ''}
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                // Progress bar
                const completed = results.filter(r => r.mark && !['DNS', 'DNF', 'DQ', 'NM'].includes(r.mark)).length;
                const total = results.length;
                const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

                html += `
                    <div style="margin-top: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                        <div style="flex:1; min-width:150px;">
                            <div style="display:flex; justify-content:space-between; font-size:14px; color:#999; margin-bottom:4px;">
                                <span>Progress</span>
                                <span>${completed}/${total}</span>
                            </div>
                            <div style="width:100%; height:6px; background:#2a2a4e; border-radius:3px; overflow:hidden;">
                                <div style="width:${pct}%; height:100%; background:#e94560; border-radius:3px; transition:width 0.5s;"></div>
                            </div>
                        </div>
                        <div style="font-size:14px; color:#666;">
                            ${isCombined ? '🏆 Ranking by Raza Points' : '📊 Ranking by Performance'}
                            ${data.uniqueClasses && data.uniqueClasses.length > 1 ? ` • Classes: ${data.uniqueClasses.join(', ')}` : ''}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function toggleAutoRefresh() {
            isAutoRefresh = !isAutoRefresh;
            const btn = document.getElementById('autoBtn');

            if (isAutoRefresh) {
                btn.textContent = '⏱ Auto: ON';
                btn.style.background = '#4CAF50';
                document.getElementById('autoStatus').textContent = 'Auto-refresh: ON (5s)';
                startAutoRefresh();
            } else {
                btn.textContent = '⏱ Auto: OFF';
                btn.style.background = '#dc3545';
                document.getElementById('autoStatus').textContent = 'Auto-refresh: OFF';
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                if (currentEventId && isAutoRefresh) {
                    loadResults();
                }
            }, 5000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        function goFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            } else if (el.msRequestFullscreen) {
                el.msRequestFullscreen();
            }
        }

        // Initialize
        loadMeetInfo();
        loadEvents();

        // Auto-select first event if available
        setTimeout(() => {
            const select = document.getElementById('eventSelect');
            if (select.options.length > 1) {
                select.selectedIndex = 1;
                loadResults();
                startAutoRefresh();
            }
        }, 1000);

        // Refresh events every minute
        setInterval(loadEvents, 60000);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                goFullscreen();
            }
            if (e.key === 'r' || e.key === 'R') {
                loadResults();
            }
            if (e.key === ' ') {
                e.preventDefault();
                toggleAutoRefresh();
            }
        });
    </script>
</body>
</html>
