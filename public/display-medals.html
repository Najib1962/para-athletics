<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medal Standings - Rotation Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
        }
        .top-bar .meet-name { font-size: 20px; font-weight: 700; color: #e94560; }
        .top-bar .meet-venue { font-size: 14px; color: #999; }
        .top-bar .status {
            font-size: 14px;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            z-index: 10;
        }
        .controls button {
            padding: 10px 20px;
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .controls button:hover { background: #2a2a4e; border-color: #e94560; }
        .controls button.active { background: #e94560; border-color: #e94560; }
        .controls button.danger { border-color: #dc3545; }
        .controls button.danger:hover { background: #dc3545; }
        .controls .info { color: #999; font-size: 14px; margin-left: 10px; }

        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 16px;
            border: 2px solid #2a2a4e;
            padding: 30px;
            min-height: 500px;
            position: relative;
            overflow: hidden;
        }

        .slide {
            animation: slideIn 0.6s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .medal-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a2a4e;
            margin-bottom: 20px;
        }
        .medal-header h1 { font-size: 36px; font-weight: 700; }
        .medal-header .meta {
            font-size: 18px;
            color: #999;
            margin-top: 5px;
        }

        .medal-table {
            flex: 1;
            width: 100%;
            border-collapse: collapse;
            font-size: 28px;
        }
        .medal-table th {
            background: #2a2a4e;
            padding: 15px 25px;
            text-align: left;
            font-weight: 600;
            color: #ccc;
            font-size: 20px;
        }
        .medal-table td {
            padding: 15px 25px;
            border-bottom: 1px solid #2a2a4e;
            font-size: 30px;
        }
        .medal-table tr:last-child td { border-bottom: none; }
        .medal-table tr:hover td { background: rgba(255,255,255,0.03); }

        .rank-col { width: 60px; text-align: center; font-weight: 700; color: #999; }
        .country-col { font-weight: 600; }
        .medal-col { text-align: center; font-weight: 700; }
        .gold { color: #FFD700; }
        .silver { color: #C0C0C0; }
        .bronze { color: #CD7F32; }
        .total-col { text-align: center; font-weight: 700; color: #fff; }

        .no-results {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 24px;
        }

        .progress-indicator {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            padding: 10px;
            border-top: 1px solid #2a2a4e;
        }
        .progress-indicator .highlight { color: #fff; font-weight: 600; }

        .footer {
            text-align: center;
            padding: 15px 20px;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            border-top: 1px solid #2a2a4e;
        }

        @media (min-width: 1200px) {
            .medal-table { font-size: 36px; }
            .medal-table td { font-size: 38px; padding: 20px 30px; }
            .medal-table th { font-size: 26px; padding: 20px 30px; }
            .medal-header h1 { font-size: 48px; }
        }
        @media (max-width: 768px) {
            .display-container { padding: 15px; }
            .medal-table { font-size: 16px; }
            .medal-table td { font-size: 18px; padding: 10px 12px; }
            .medal-table th { font-size: 14px; padding: 10px 12px; }
            .medal-header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <div class="meet-name" id="meetName">🏃 Para Athletics</div>
            <div class="meet-venue" id="meetVenue">Loading...</div>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>MEDAL STANDINGS</span>
            <span style="margin-left: 15px; color: #666;" id="updateTime">Loading...</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleRotation()" id="toggleBtn" class="active">⏸ Pause</button>
        <button onclick="goFullscreen()">⛶ Fullscreen</button>
        <button onclick="refreshData()">🔄 Refresh</button>
        <span class="info" id="updateCounter">Updated: --</span>
        <span class="info" style="margin-left: 15px;" id="timerDisplay">⏱ 10s</span>
    </div>

    <div class="display-container" id="displayContainer">
        <div class="no-results">Loading medal standings...</div>
    </div>

    <div class="footer">
        <span>🏅 Medal Standings • Rotation Mode</span>
        <span style="margin-left: 20px;" id="autoStatus">Auto-refreshing every 10 seconds</span>
    </div>

    <script>
        let isRotating = true;
        let rotationInterval = null;
        const DISPLAY_DURATION = 10000;

        async function fetchAPI(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }

        async function loadMeetInfo() {
            try {
                const meet = await fetchAPI('/api/meet');
                document.getElementById('meetName').textContent = `🏃 ${meet.name || 'Para Athletics'}`;
                document.getElementById('meetVenue').textContent = `${meet.venue || ''} • ${meet.date || ''}`;
            } catch (error) {
                console.error('Error loading meet info:', error);
            }
        }

        async function loadData() {
            try {
                const events = await fetchAPI('/api/events');
                const completedEvents = events.filter(e => e.status === 'official');

                if (completedEvents.length === 0) {
                    document.getElementById('displayContainer').innerHTML = `
                        <div class="no-results">No completed events yet.</div>
                    `;
                    document.getElementById('updateCounter').textContent = 'No events completed';
                    return;
                }

                const medalWinners = {};

                for (const event of completedEvents) {
                    try {
                        const data = await fetchAPI(`/api/events/${event.id}/results`);
                        const results = data.results || [];
                        const validResults = results.filter(r => r.rank !== '-' && !['DNS', 'DNF', 'DQ', 'NM'].includes(r.mark));
                        const top3 = validResults.slice(0, 3);

                        top3.forEach((r, index) => {
                            const medal = index === 0 ? 'gold' : index === 1 ? 'silver' : 'bronze';
                            const country = r.club || 'Unknown';
                            if (!medalWinners[country]) {
                                medalWinners[country] = { gold: 0, silver: 0, bronze: 0, total: 0 };
                            }
                            medalWinners[country][medal]++;
                            medalWinners[country].total++;
                        });
                    } catch (error) {
                        console.error('Error loading event results:', error);
                    }
                }

                const sorted = Object.entries(medalWinners)
                    .sort((a, b) => {
                        if (a[1].gold !== b[1].gold) return b[1].gold - a[1].gold;
                        if (a[1].silver !== b[1].silver) return b[1].silver - a[1].silver;
                        return b[1].bronze - a[1].bronze;
                    });

                if (sorted.length === 0) {
                    document.getElementById('displayContainer').innerHTML = `
                        <div class="no-results">No medal winners yet.</div>
                    `;
                    return;
                }

                renderMedals(sorted, completedEvents.length);
                document.getElementById('updateCounter').textContent = `Updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('displayContainer').innerHTML = `
                    <div class="no-results">Error loading medal standings: ${error.message}</div>
                `;
            }
        }

        function renderMedals(sorted, eventCount) {
            const container = document.getElementById('displayContainer');

            let html = `
                <div class="slide">
                    <div class="medal-header">
                        <h1>🏅 Medal Standings</h1>
                        <div class="meta">Based on ${eventCount} completed events</div>
                    </div>
                    <table class="medal-table">
                        <thead>
                            <tr>
                                <th class="rank-col">#</th>
                                <th class="country-col">Country / Club</th>
                                <th class="medal-col">🥇 Gold</th>
                                <th class="medal-col">🥈 Silver</th>
                                <th class="medal-col">🥉 Bronze</th>
                                <th class="total-col">Total</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            sorted.forEach(([country, medals], index) => {
                html += `
                    <tr>
                        <td class="rank-col">${index + 1}</td>
                        <td class="country-col">${country}</td>
                        <td class="medal-col gold">${medals.gold}</td>
                        <td class="medal-col silver">${medals.silver}</td>
                        <td class="medal-col bronze">${medals.bronze}</td>
                        <td class="total-col">${medals.total}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                    <div class="progress-indicator">
                        <span class="highlight">${sorted.length}</span> countries/clubs with medals • Updated: ${new Date().toLocaleTimeString()}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function toggleRotation() {
            isRotating = !isRotating;
            const btn = document.getElementById('toggleBtn');
            if (isRotating) {
                btn.textContent = '⏸ Pause';
                btn.className = 'active';
                document.getElementById('autoStatus').textContent = 'Auto-refreshing every 10 seconds';
                startRotation();
            } else {
                btn.textContent = '▶ Play';
                btn.className = 'danger';
                document.getElementById('autoStatus').textContent = '⏸ Paused';
                stopRotation();
            }
        }

        function startRotation() {
            if (rotationInterval) clearInterval(rotationInterval);
            rotationInterval = setInterval(() => {
                if (isRotating) loadData();
            }, DISPLAY_DURATION);
            resetTimer();
        }

        function stopRotation() {
            if (rotationInterval) { clearInterval(rotationInterval); rotationInterval = null; }
            document.getElementById('timerDisplay').textContent = '⏱ Paused';
        }

        function resetTimer() {
            if (isRotating) {
                document.getElementById('timerDisplay').textContent = `⏱ ${DISPLAY_DURATION / 1000}s`;
                let count = DISPLAY_DURATION / 1000;
                const timerInterval = setInterval(() => {
                    count--;
                    if (count <= 0 || !isRotating) { clearInterval(timerInterval); if (isRotating) document.getElementById('timerDisplay').textContent = `⏱ ${DISPLAY_DURATION / 1000}s`; return; }
                    document.getElementById('timerDisplay').textContent = `⏱ ${count}s`;
                }, 1000);
            }
        }

        function goFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        }

        async function refreshData() { await loadData(); if (isRotating) startRotation(); }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') goFullscreen();
            if (e.key === ' ') { e.preventDefault(); toggleRotation(); }
            if (e.key === 'r' || e.key === 'R') refreshData();
        });

        loadMeetInfo();
        loadData();
        setTimeout(() => { if (isRotating) startRotation(); }, 2000);
        setInterval(loadData, 60000);
    </script>
</body>
</html>
